// ---------- geometry: 15 x 10 cells of 20 x 18 px ----------
const CW=20,CH=18,COLS=15,FROWS=10;
const OX=10,OY=20;                       // field offset (top bar = 20px)
const FW=COLS*CW,FH=FROWS*CH;            // 300 x 180
const W=320,H=200;
const TOL=4;
const DIRS={R:{x:1,y:0},L:{x:-1,y:0},U:{x:0,y:-1},D:{x:0,y:1}};
const DIRLIST=[DIRS.R,DIRS.L,DIRS.U,DIRS.D];

function inB(c,r){return c>=0&&c<COLS&&r>=0&&r<FROWS;}
function idx(c,r){return r*COLS+c;}
function ccx(c){return OX+c*CW+CW/2;}
function ccy(r){return OY+r*CH+CH/2;}
function colOf(x){return Math.max(0,Math.min(COLS-1,((x-OX)/CW)|0));}
function rowOf(y){return Math.max(0,Math.min(FROWS-1,((y-OY)/CH)|0));}

function spr(rows){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++){const row=rows[y];
    for(let x=0;x<row.length;x++){const k=row[x];
      if(k!=='.'&&PAL[k]){g.fillStyle=PAL[k];g.fillRect(x,y,1,1);}}}
  return c;
}
function flipH(s){
  const c=document.createElement('canvas');c.width=s.width;c.height=s.height;
  const g=c.getContext('2d');g.translate(s.width,0);g.scale(-1,1);g.drawImage(s,0,0);
  return c;
}
const S={};
function buildSprites(){
  S.dig1=spr(M.DIG1);S.dig2=spr(M.DIG2);
  S.dig1f=flipH(S.dig1);S.dig2f=flipH(S.dig2);
  S.nob1=spr(M.NOB1);S.nob2=spr(M.NOB2);
  S.hob1=spr(M.HOB1);S.hob2=spr(M.HOB2);
  S.emer=spr(M.EMER);S.bag=spr(M.BAG);S.gold=spr(M.GOLD);
  S.cherry=spr(M.CHERRY);S.tomb=spr(M.TOMB);
}

// ---------- canvases ----------
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const dirtPat=document.createElement('canvas');dirtPat.width=FW;dirtPat.height=FH;
const dpx=dirtPat.getContext('2d');
const mask=document.createElement('canvas');mask.width=FW;mask.height=FH;
const mctx=mask.getContext('2d');
const dirtView=document.createElement('canvas');dirtView.width=FW;dirtView.height=FH;
const dvx=dirtView.getContext('2d');

function buildDirt(){
  dpx.clearRect(0,0,FW,FH);
  dpx.fillStyle=PAL.dirt;dpx.fillRect(0,0,FW,FH);
  dpx.fillStyle=PAL.dirtDot;
  for(let y=0;y<FH;y+=4){
    const sh=(((y/4)|0)%2)?2:0;
    for(let x=sh;x<FW;x+=4)dpx.fillRect(x,y,1,1);
  }
  dpx.fillStyle=PAL.dirtDark;
  for(let y=2;y<FH;y+=6){
    const sh=(((y/6)|0)%3)*2;
    for(let x=sh;x<FW;x+=7)dpx.fillRect(x,y,2,1);
  }
}
function togglePalette(){
  palName=palName==='cga'?'vga':'cga';PAL=PALETTES[palName];
  buildSprites();buildDirt();
}

// ---------- dirt state ----------
let dug=new Uint8Array(COLS*FROWS);
function isDug(c,r){return inB(c,r)&&dug[idx(c,r)]===1;}
function setDug(c,r){if(inB(c,r))dug[idx(c,r)]=1;}
function carve(x,y){mctx.fillStyle='#fff';mctx.fillRect(Math.round(x)-OX-7,Math.round(y)-OY-6,14,12);}
function carveCell(c,r){
  setDug(c,r);
  mctx.fillStyle='#fff';mctx.fillRect(c*CW+3,r*CH+3,CW-6,CH-6);
}
function carveJoin(c1,r1,c2,r2){ // open the wall between two adjacent carved cells
  mctx.fillStyle='#fff';
  const x=Math.min(ccx(c1),ccx(c2))-OX-7,y=Math.min(ccy(r1),ccy(r2))-OY-6;
  mctx.fillRect(x,y,Math.abs(ccx(c2)-ccx(c1))+14,Math.abs(ccy(r2)-ccy(r1))+12);
}

// ---------- audio: tiny synth + sequencer ----------
let actx=null,muted=false;
function AC(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  return actx;
}
function osc(f,d,type,v,t0){      // schedule one note at absolute audio time
  if(!actx||muted||!f)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(v||.05,t0);
  g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(actx.destination);
  o.start(t0);o.stop(t0+d+.02);
}
function tone(f,d,type,v,f2){
  const a=AC();if(!a||muted)return;
  const t0=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+d);
  g.gain.setValueAtTime(v||.06,t0);
  g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02);
}
function noise(d,v,fc){
  const a=AC();if(!a||muted)return;
  const n=(a.sampleRate*d)|0;
  const b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||900;
  const g=a.createGain();
  g.gain.setValueAtTime(v||.1,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();
}

  [N.E4,N.E2],[N.G4,0],[N.B4,N.E2],[N.G4,0],[N.E5,N.E2],[N.D5,0],[N.B4,N.E2],[N.G4,0]]};
// --- bonus loop: gallop motif after Rossini's William Tell finale (public domain)

  [N.E4,N.E2],[N.A4,0],[N.B4,0],[N.C5,0],[N.B4,N.E2],[N.A4,0],[N.G4,0],[N.E4,0]]};
let seq=null;
function startMusic(m,loop){const a=AC();if(!a)return;seq={m,i:0,next:a.currentTime+.05,loop};}
function stopMusic(){seq=null;}
function pumpMusic(){
  if(!seq||!actx)return;
  if(muted){seq.next=actx.currentTime+.05;return;}
  while(seq.next<actx.currentTime+.14){
    const st=seq.m.pat[seq.i];
    osc(st[0],seq.m.step*.92,'square',.035,seq.next);
    osc(st[1],seq.m.step*1.8,'triangle',.06,seq.next);
    seq.next+=seq.m.step;
    seq.i++;
    if(seq.i>=seq.m.pat.length){if(seq.loop)seq.i=0;else{seq=null;break;}}
  }
}
// --- one-shot motif after Chopin's funeral march (public domain)
function playFuneral(){
  const a=AC();if(!a||muted)return;
  let t=a.currentTime+.05;
  const ns=[[N.A3,.5],[N.A3,.32],[N.A3,.13],[N.A3,.55],[N.C4,.45],[N.B3,.3],[N.B3,.15],[N.A3,.7]];
  for(const [f,d] of ns){osc(f,d*.95,'triangle',.09,t);osc(f/2,d*.95,'sine',.07,t);t+=d;}
}
const sEmer=()=>tone(420+Math.min(emCombo,8)*70,.09,'square',.06);
const sGold=()=>{tone(N.C5,.08,'square',.06);tone(N.E5,.08,'square',.06);};
const sGold2=()=>{tone(N.G5,.12,'square',.06);};
const sFire=()=>tone(1200,.16,'sawtooth',.05,150);
const sKill=()=>{noise(.2,.12,1400);tone(180,.25,'sawtooth',.07,50);};
const sWob=()=>tone(85,.07,'square',.06);
const sFall=()=>tone(300,.3,'square',.05,70);
const sBreak=()=>{noise(.22,.15,500);tone(60,.2,'sine',.1);};
const sCherry=()=>{[N.C5,N.E5,N.G5,N.A5].forEach((f,i)=>osc(f,.1,'square',.06,(AC()?actx.currentTime:0)+i*.07));};
const sEat=n=>tone(300+n*150,.15,'square',.08,600+n*150);
const sSpawn=()=>tone(700,.1,'square',.04,1000);
const sMorph=()=>tone(200,.3,'sawtooth',.05,800);
const sClear=()=>{[N.C5,N.E5,N.G5,N.C5*2,N.G5,N.C5*2].forEach((f,i)=>osc(f,.1,'square',.06,(AC()?actx.currentTime:0)+i*.1));};
const sLife=()=>{[N.E5,N.A5,N.C5*2].forEach((f,i)=>osc(f,.1,'square',.07,(AC()?actx.currentTime:0)+i*.09));};

// ---------- game state ----------
let state='title',stateT=0;

function saveHi(){try{localStorage.setItem('webdigger_hi',hi);}catch(e){}}

function mkMonster(hobbin){
  return {hobbin,x:ccx(14),y:ccy(0),sx:14,sy:0,dir:null,tx:0,ty:0,
    morphT:24+Math.random()*10-Math.min(14,level*1.5),
    anim:Math.random()*10,dead:false,stuckT:0,fleeing:false};
}
function bagAt(c,r){return bags.find(b=>(b.state==='rest'||b.state==='wobble')&&b.c===c&&b.r===r);}
function goldAt(c,r){return golds.find(g=>g.c===c&&g.r===r);}
function emeraldAt(c,r){return emeralds.find(e=>e.c===c&&e.r===r);}
function playerPass(c,r){return inB(c,r)&&!bagAt(c,r);}
function nobbinPass(c,r){return inB(c,r)&&isDug(c,r)&&!bagAt(c,r);}
function hobbinPass(c,r){return inB(c,r);}

function loadLevel(){
  dug=new Uint8Array(COLS*FROWS);
  mctx.clearRect(0,0,FW,FH);
  emeralds=[];bags=[];golds=[];monsters=[];popups=[];particles=[];
  bolt=null;cherry=null;tomb=null;
  bonusMode=false;bonusDone=false;bonusChain=0;emCombo=0;
  const lay=LAYOUTS[(level-1)%LAYOUTS.length];
  const carved=[];
  for(let r=0;r<FROWS;r++){
    const row=((lay[r]||'')+'...............').slice(0,15);
    for(let c=0;c<COLS;c++){
      const ch=row[c];
      if(ch==='E')emeralds.push({c,r});
      else if(ch==='B')bags.push({c,r,x:ccx(c),y:ccy(r),state:'rest',t:0,from:r,gone:false});
      else if(ch===' '||ch==='S'||ch==='M'){carveCell(c,r);carved.push([c,r]);}
      if(ch==='S'){p.start={c,r};}
    }
  }
  // open walls between adjacent carved cells so tunnels read as tunnels
  for(const [c,r] of carved){
    if(isDug(c+1,r))carveJoin(c,r,c+1,r);
    if(isDug(c,r+1))carveJoin(c,r,c,r+1);
  }
  spawner={
    quota:Math.min(12,4+level),
    spawned:0,t:1.5,
    interval:Math.max(2.2,5.2-level*.35),
    aliveCap:Math.min(5,2+((level+1)/2|0))
  };
  NSPD=Math.min(72,44+level*3);
  HSPD=Math.min(64,40+level*2.6);
  resetPlayer();
}
function resetPlayer(){
  p.x=ccx(p.start.c);p.y=ccy(p.start.r);
  p.face=DIRS.R;p.anim=0;p.grace=0;p.fireReady=true;p.fireT=0;
  bolt=null;
}
function newGame(){
  score=0;lives=2;level=1;nextLife=20000;
  loadLevel();state='ready';stateT=0;
}

// ---------- input ----------
const DKEY={ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R'};
let dirOrder=[],firePressed=false;
addEventListener('keydown',e=>{
  AC();
  const d=DKEY[e.code];
  if(d){if(!dirOrder.includes(d))dirOrder.push(d);e.preventDefault();}
  if(e.code==='Space'||e.code==='ControlLeft'||e.code==='ControlRight'){
    if(!e.repeat)firePressed=true;e.preventDefault();
  }
  if(e.repeat)return;
  if(e.code==='Enter'){
    if(state==='title')newGame();
    else if(state==='gameover'){state='title';stateT=0;stopMusic();}
  }
  if(e.code==='KeyP'){if(state==='play')state='pause';else if(state==='pause')state='play';}
  if(e.code==='KeyM')muted=!muted;
  if(e.code==='KeyC')togglePalette();
});
addEventListener('keyup',e=>{
  const d=DKEY[e.code];
  if(d){const i=dirOrder.indexOf(d);if(i>=0)dirOrder.splice(i,1);}
});
addEventListener('blur',()=>{if(state==='play')state='pause';});
function desiredDir(){return dirOrder.length?DIRS[dirOrder[dirOrder.length-1]]:null;}

// ============================================================
//  gameplay
// ============================================================
function tryAdvance(e,d,dist,pass){
  if(d.x!==0){
    const r=rowOf(e.y);e.y=ccy(r);
    const c=colOf(e.x);
    let nx=e.x+d.x*dist;
    if(!pass(c+d.x,r))nx=d.x>0?Math.min(nx,ccx(c)):Math.max(nx,ccx(c));
    const moved=Math.abs(nx-e.x)>.001;e.x=nx;return moved;
  }else{
    const c=colOf(e.x);e.x=ccx(c);
    const r=rowOf(e.y);
    let ny=e.y+d.y*dist;
    if(!pass(c,r+d.y))ny=d.y>0?Math.min(ny,ccy(r)):Math.max(ny,ccy(r));
    const moved=Math.abs(ny-e.y)>.001;e.y=ny;return moved;
  }
}
function addScore(n){
  score+=n;
  while(score>=nextLife){lives++;nextLife+=20000;popup(p.x,p.y-10,'EXTRA LIFE');sLife();}
  if(score>hi)hi=score;
}
function popup(x,y,txt){popups.push({x,y,txt,t:1.1});}
function burst(x,y,col){
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*45,vy:Math.sin(a)*45,t:.4,col});}
}

// ---------- player ----------
function tryPush(b,dirx,dist){
  const beyond=b.c+dirx;
  if(!inB(beyond,b.r)||!isDug(beyond,b.r)||bagAt(beyond,b.r))return false;
  b.x+=dirx*dist;
  b.c=colOf(b.x);
  return true;
}
function fireBolt(){
  bolt={x:p.x+p.face.x*8,y:p.y+p.face.y*7,dir:{x:p.face.x,y:p.face.y}};
  p.fireReady=false;p.fireT=2.6+level*.25;
  sFire();
}
function updatePlayer(dt){
  if(p.grace>0)p.grace-=dt;
  if(!p.fireReady){p.fireT-=dt;if(p.fireT<=0){p.fireReady=true;}}
  if(firePressed&&p.fireReady&&!bolt)fireBolt();
  emTimer-=dt;if(emTimer<=0)emCombo=0;
  const want=desiredDir();
  if(want){
    const c=colOf(p.x),r=rowOf(p.y);
    let mv;
    if(want.x!==0){
      const ty=ccy(r),dy=ty-p.y;
      if(Math.abs(dy)<=TOL){p.y=ty;mv=want;}
      else mv={x:0,y:Math.sign(dy)};
    }else{
      const tx=ccx(c),dx=tx-p.x;
      if(Math.abs(dx)<=TOL){p.x=tx;mv=want;}
      else mv={x:Math.sign(dx),y:0};
    }
    const spd=68*dt;
    let moved=false;
    if(mv===want){
      let pushed=false;
      if(want.x!==0){
        const nb=bagAt(c+want.x,r);
        if(nb&&Math.abs(nb.x-p.x)<=CW+1){
          pushed=true;
          if(tryPush(nb,want.x,spd*.45)){p.x+=want.x*spd*.45;moved=true;}
        }
      }
      if(!pushed)moved=tryAdvance(p,mv,spd,playerPass);
    }else if(mv.x!==0){
      const tx=ccx(c),step=Math.min(spd,Math.abs(tx-p.x));
      if(step>.001){p.x+=Math.sign(tx-p.x)*step;moved=true;}
    }else{
      const ty=ccy(r),step=Math.min(spd,Math.abs(ty-p.y));
      if(step>.001){p.y+=Math.sign(ty-p.y)*step;moved=true;}
    }
    if(moved){
      p.face=mv;p.anim+=dt;
      carve(p.x,p.y);
      const c2=colOf(p.x),r2=rowOf(p.y);
      if(!isDug(c2,r2)&&Math.abs(p.x-ccx(c2))<4&&Math.abs(p.y-ccy(r2))<4)setDug(c2,r2);
    }
  }
  // pickups
  const c=colOf(p.x),r=rowOf(p.y);
  const em=emeraldAt(c,r);
  if(em&&Math.abs(p.x-ccx(c))<8&&Math.abs(p.y-ccy(r))<8){
    emeralds.splice(emeralds.indexOf(em),1);
    addScore(25);emCombo++;emTimer=5;sEmer();
    if(emCombo>=8){addScore(250);popup(p.x,p.y-8,'250');emCombo=0;}
  }
  const go=goldAt(c,r);
  if(go&&Math.abs(p.x-ccx(c))<9&&Math.abs(p.y-ccy(r))<9){
    golds.splice(golds.indexOf(go),1);
    addScore(500);popup(p.x,p.y-8,'500');sGold();sGold2();
  }
  if(cherry&&Math.abs(p.x-cherry.x)<10&&Math.abs(p.y-cherry.y)<10){
    cherry=null;addScore(1000);popup(p.x,p.y-8,'1000');sCherry();
    bonusMode=true;bonusT=Math.max(6,16-level);bonusChain=0;bonusDone=true;
    startMusic(BONUSM,true);
  }
}

// ---------- fire bolt ----------
function updateBolt(dt){
  if(!bolt)return;
  bolt.x+=bolt.dir.x*280*dt;bolt.y+=bolt.dir.y*280*dt;
  if(bolt.x<OX+2||bolt.x>OX+FW-2||bolt.y<OY+2||bolt.y>OY+FH-2){bolt=null;return;}
  const c=colOf(bolt.x),r=rowOf(bolt.y);
  if(!isDug(c,r)&&!(c===colOf(p.x)&&r===rowOf(p.y))){bolt=null;return;}
  if(bagAt(c,r)&&Math.abs(bolt.x-ccx(c))<9){bolt=null;return;}
  for(const m of monsters){
    if(m.dead)continue;
    if(Math.abs(m.x-bolt.x)<9&&Math.abs(m.y-bolt.y)<9){
      killMonster(m);bolt=null;return;
    }
  }
}
function killMonster(m){
  m.dead=true;addScore(250);popup(m.x,m.y-8,'250');
  burst(m.x,m.y,PAL.r);sKill();
}

// ---------- gold bags ----------
function updateBags(dt){
  for(const b of bags){
    if(b.gone)continue;
    if(b.state==='rest'){
      const settled=Math.abs(b.x-ccx(b.c))<1;
      if(settled&&b.r+1<FROWS&&isDug(b.c,b.r+1)&&!bagAt(b.c,b.r+1)){
        b.x=ccx(b.c);b.state='wobble';b.t=1.0;sWob();
      }
    }else if(b.state==='wobble'){
      b.t-=dt;
      if(((b.t*8)|0)%4===0)sWob();
      if(b.t<=0){
        b.state='fall';b.from=b.r;
        carveCell(b.c,b.r);   // leaves a hole where it was buried
        sFall();
      }
    }else if(b.state==='fall'){
      b.y+=130*dt;
      const r=rowOf(b.y);b.r=r;
      for(const m of monsters){
        if(m.dead)continue;
        if(Math.abs(m.x-b.x)<10&&Math.abs(m.y-b.y)<12)killMonster(m);
      }
      if(state==='play'&&p.grace<=0&&Math.abs(p.x-b.x)<10&&Math.abs(p.y-b.y)<12){die();}
      const below=r+1;
      const blocked=below>=FROWS||!isDug(b.c,below)||bagAt(b.c,below);
      if(blocked&&b.y>=ccy(r)){
        b.y=ccy(r);
        if(r-b.from>=2){b.state='breaking';b.t=.45;sBreak();}
        else{b.state='rest';sWob();}
      }
    }else if(b.state==='breaking'){
      b.t-=dt;
      if(b.t<=0){golds.push({c:b.c,r:b.r});b.gone=true;}
    }
  }
  bags=bags.filter(b=>!b.gone);
}

// ---------- monsters ----------
function aliveMon(){return monsters.filter(m=>!m.dead).length;}
function monDist(c,r,d){return Math.abs(ccx(c+d.x)-p.x)+Math.abs(ccy(r+d.y)-p.y);}
function chooseDir(m){
  const c=colOf(m.x),r=rowOf(m.y);
  const pass=m.hobbin?hobbinPass:nobbinPass;
  const opts=DIRLIST.filter(d=>pass(c+d.x,r+d.y));
  if(!opts.length){m.dir=null;return;}
  let pool=opts;
  if(m.dir){
    const fwd=opts.filter(d=>!(d.x===-m.dir.x&&d.y===-m.dir.y));
    if(fwd.length)pool=fwd;
  }
  let pick;
  const chase=bonusMode?.15:.8;     // in bonus mode they run away
  if(Math.random()<.85){
    const sorted=pool.slice().sort((a,b)=>monDist(c,r,a)-monDist(c,r,b));
    pick=Math.random()<chase?sorted[0]:sorted[sorted.length-1];
  }else pick=pool[(Math.random()*pool.length)|0];
  m.dir=pick;m.tx=ccx(c+pick.x);m.ty=ccy(r+pick.y);
  if(pick.x!==0)m.fx=pick.x;
}
function updateMonsters(dt){
  // spawner
  if(spawner.spawned<spawner.quota){
    spawner.t-=dt;
    if(spawner.t<=0&&aliveMon()<spawner.aliveCap){
      spawner.t=spawner.interval;
      spawner.spawned++;
      const hob=Math.random()<Math.min(.4,(level-1)*.07);
      monsters.push(mkMonster(hob));sSpawn();
      if(spawner.spawned===spawner.quota&&!bonusDone)
        cherry={x:ccx(14),y:ccy(0),t:15};
    }
  }
  if(cherry){cherry.t-=dt;if(cherry.t<=0)cherry=null;}
  if(bonusMode){
    bonusT-=dt;
    if(bonusT<=0){bonusMode=false;startMusic(BGM,true);}
  }
  for(const m of monsters){
    if(m.dead)continue;
    m.anim+=dt;
    // morph nobbin -> hobbin
    if(!m.hobbin){
      m.morphT-=dt*(m.dir?1:4);
      if(m.morphT<=0){m.hobbin=true;m.dir=null;sMorph();burst(m.x,m.y,PAL.w);}
    }
    if(m.hobbin){
      carve(m.x,m.y);  // hobbins dig
      const c=colOf(m.x),r=rowOf(m.y);
      if(Math.abs(m.x-ccx(c))<4&&Math.abs(m.y-ccy(r))<4){
        setDug(c,r);
        // hobbins devour emeralds, gold and even bags
        const em=emeraldAt(c,r);if(em)emeralds.splice(emeralds.indexOf(em),1);
        const go=goldAt(c,r);if(go)golds.splice(golds.indexOf(go),1);
        const bg=bagAt(c,r);if(bg){bg.gone=true;bags=bags.filter(b=>!b.gone);}
      }
    }
    const spd=(m.hobbin?HSPD:NSPD)*(bonusMode?.72:1)*dt;
    if(!m.dir)chooseDir(m);
    if(m.dir){
      const dx=m.tx-m.x,dy=m.ty-m.y;
      if(Math.abs(dx)+Math.abs(dy)<=spd){m.x=m.tx;m.y=m.ty;chooseDir(m);}
      else{
        m.x+=Math.sign(dx)*Math.min(spd,Math.abs(dx));
        m.y+=Math.sign(dy)*Math.min(spd,Math.abs(dy));
      }
    }
    // touch the digger
    if(state==='play'&&Math.abs(m.x-p.x)<10&&Math.abs(m.y-p.y)<10){
      if(bonusMode){
        m.dead=true;
        const pts=200*Math.pow(2,Math.min(bonusChain,4));
        addScore(pts);popup(m.x,m.y-8,''+pts);sEat(bonusChain);bonusChain++;
      }else if(p.grace<=0)die();
    }
  }
  monsters=monsters.filter(m=>!m.dead);
}

function die(){
  if(state!=='play')return;
  state='dying';stateT=0;
  tomb={x:p.x,y:p.y};
  bolt=null;bonusMode=false;
  stopMusic();playFuneral();
}

// ============================================================
//  state machine, rendering, main loop
// ============================================================
function update(dt){
  stateT+=dt;
  pumpMusic();
  for(const o of popups){o.t-=dt;o.y-=12*dt;}
  popups=popups.filter(o=>o.t>0);
  for(const q of particles){q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}
  particles=particles.filter(q=>q.t>0);
  switch(state){
    case 'ready':
      if(stateT>1.6){state='play';stateT=0;p.grace=1.5;startMusic(BGM,true);}
      break;
    case 'play':{
      updatePlayer(dt);
      updateBolt(dt);
      updateBags(dt);
      updateMonsters(dt);
      if(state!=='play')break;     // died mid-update
      const cleared=emeralds.length===0||
        (spawner.spawned>=spawner.quota&&aliveMon()===0);
      if(cleared){state='clear';stateT=0;stopMusic();sClear();}
      break;}
    case 'dying':
      if(stateT>2.6){
        lives--;
        if(lives<0){saveHi();state='gameover';stateT=0;}
        else{
          // monsters on screen at death come back through the door
          spawner.spawned=Math.max(0,spawner.spawned-aliveMon());
          monsters=[];tomb=null;spawner.t=1.5;
          resetPlayer();state='ready';stateT=0;
        }
      }
      break;
    case 'clear':
      if(stateT>2){level++;loadLevel();state='ready';stateT=0;}
      break;
    case 'gameover':
      if(stateT>3.5){state='title';stateT=0;}
      break;
  }
  firePressed=false;
}

// ---------- drawing ----------
function drawPlayer(){
  if(state==='dying')return;
  if(p.grace>0&&((p.grace*12)|0)%2)return;
  const f=((p.anim*6)|0)%2;
  let img=f?S.dig2:S.dig1;
  const d=p.face;
  ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));
  if(d.y<0)ctx.rotate(-Math.PI/2);
  else if(d.y>0)ctx.rotate(Math.PI/2);
  else if(d.x<0)ctx.scale(-1,1);
  ctx.drawImage(img,-7,-6);
  ctx.restore();
  if(!p.fireReady&&((stateT*8)|0)%2===0){
    ctx.fillStyle=PAL.accent;
    ctx.fillRect(Math.round(p.x)-1,Math.round(p.y)-10,2,2);
  }
}
function drawMonster(m){
  const f=((m.anim*5)|0)%2;
  let img=m.hobbin?(f?S.hob2:S.hob1):(f?S.nob2:S.nob1);
  if(m.fx<0)img=flipCache(img);
  ctx.drawImage(img,Math.round(m.x)-6,Math.round(m.y)-6);
}
const _flips=new Map();
function flipCache(img){
  if(!_flips.has(img))_flips.set(img,flipH(img));
  return _flips.get(img);
}
function drawBag(b){
  const wob=b.state==='wobble'?(((b.t*14)|0)%2?1:-1):0;
  if(b.state==='breaking'){
    ctx.drawImage(S.bag,0,0,10,10,Math.round(b.x)-7,Math.round(b.y)+1,14,5);
  }else{
    ctx.drawImage(S.bag,Math.round(b.x)-5+wob,Math.round(b.y)-5);
  }
}
function drawHUD(){
  ctx.textAlign='left';
  ctx.fillStyle=PAL.accent;ctx.fillText('SCORE',4,3);
  ctx.fillStyle=PAL.text;ctx.fillText(String(score).padStart(6,'0'),40,3);
  ctx.fillStyle=PAL.accent;ctx.fillText('HI',96,3);
  ctx.fillStyle=PAL.text;ctx.fillText(String(hi).padStart(6,'0'),112,3);
  ctx.fillStyle=p.fireReady?PAL.accent2:PAL.dirtDark;
  ctx.fillText('FIRE',164,3);
  ctx.fillStyle=PAL.accent2;ctx.fillText('L'+level,198,3);
  for(let i=0;i<Math.min(lives,4);i++)
    ctx.drawImage(S.dig1,0,1,14,9,222+i*17,2,14,9);
  if(bonusMode){
    ctx.fillStyle=PAL.accent;ctx.textAlign='right';
    ctx.fillText('BONUS '+Math.ceil(bonusT),W-4,12);
    ctx.textAlign='left';
  }
}
function drawTitle(){
  ctx.textAlign='center';
  ctx.fillStyle=PAL.accent;
  ctx.font='bold 22px "Courier New",monospace';
  ctx.fillText('WEB DIGGER',W/2,24);
  ctx.font='8px "Courier New",monospace';
  ctx.fillStyle=PAL.accent2;
  ctx.fillText('A TRIBUTE TO THE 1983 PC CLASSIC',W/2,52);
  ctx.fillStyle=PAL.text;
  ctx.fillText('CGA EDITION',W/2,64);
  const ry=92;
  ctx.textAlign='left';ctx.fillStyle=PAL.text;
  ctx.drawImage(S.emer,86,ry-4);   ctx.fillText('EMERALD 25 ... 8 IN A ROW 250',100,ry-3);
  ctx.drawImage(S.bag,84,ry+10);   ctx.fillText('GOLD 500 - MIND YOUR HEAD',100,ry+13);
  ctx.drawImage(S.nob1,84,ry+26);  ctx.fillText('NOBBIN 250 - HOBBINS DIG!',100,ry+29);
  ctx.drawImage(S.cherry,85,ry+42);ctx.fillText('CHERRY 1000 + BONUS TIME',100,ry+45);
  ctx.textAlign='center';
  if(((stateT*2)|0)%2===0){
    ctx.fillStyle=PAL.accent;ctx.fillText('PRESS ENTER TO PLAY',W/2,164);
  }
  ctx.fillStyle=PAL.accent2;
  ctx.fillText('HI-SCORE  '+String(hi).padStart(6,'0'),W/2,178);
  ctx.fillStyle='#888888';
  ctx.fillText('ARROWS MOVE - SPACE FIRE - C COLORS',W/2,191);
  ctx.textAlign='left';
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.font='8px "Courier New",monospace';ctx.textBaseline='top';
  if(state==='title'){drawTitle();return;}
  // dirt = pattern minus carved mask
  dvx.clearRect(0,0,FW,FH);
  dvx.drawImage(dirtPat,0,0);
  dvx.globalCompositeOperation='destination-out';
  dvx.drawImage(mask,0,0);
  dvx.globalCompositeOperation='source-over';
  ctx.drawImage(dirtView,OX,OY);
  // buried goodies (visible in the dirt, like the original)
  for(const e of emeralds)ctx.drawImage(S.emer,ccx(e.c)-4,ccy(e.r)-4);
  for(const g of golds)ctx.drawImage(S.gold,ccx(g.c)-6,ccy(g.r)+1);
  for(const b of bags)drawBag(b);
  if(cherry&&(cherry.t>4||((cherry.t*8)|0)%2===0))
    ctx.drawImage(S.cherry,Math.round(cherry.x)-5,Math.round(cherry.y)-4);
  if(bolt){
    ctx.fillStyle=PAL.w;
    ctx.fillRect(Math.round(bolt.x)-2,Math.round(bolt.y)-1,4,2);
  }
  for(const m of monsters)drawMonster(m);
  if(tomb)ctx.drawImage(S.tomb,Math.round(tomb.x)-5,Math.round(tomb.y)-5);
  drawPlayer();
  for(const q of particles){ctx.fillStyle=q.col;ctx.fillRect(Math.round(q.x)-1,Math.round(q.y)-1,2,2);}
  // bonus mode inverts the playfield, CGA style
  if(bonusMode&&(bonusT>2.5||((bonusT*6)|0)%2===0)){
    ctx.globalCompositeOperation='difference';
    ctx.fillStyle='#fff';ctx.fillRect(OX,OY,FW,FH);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.textAlign='center';ctx.fillStyle=PAL.accent;
  for(const o of popups)ctx.fillText(o.txt,Math.round(o.x),Math.round(o.y)-4);
  ctx.textAlign='left';
  drawHUD();
  ctx.textAlign='center';
  const my=OY+FH/2-4;
  if(state==='ready'){ctx.fillStyle=PAL.accent;ctx.fillText('LEVEL '+level,W/2,my);}
  if(state==='pause'){ctx.fillStyle=PAL.text;ctx.fillText('PAUSED',W/2,my);}
  if(state==='gameover'){
    ctx.fillStyle=PAL.accent;
    ctx.font='bold 12px "Courier New",monospace';
    ctx.fillText('GAME OVER',W/2,my-4);
  }
  if(state==='clear'&&((stateT*6)|0)%2===0){
    ctx.fillStyle=PAL.accent2;ctx.fillText('LEVEL CLEAR!',W/2,my);
  }
  ctx.textAlign='left';
}

// ---------- loop + boot ----------
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state!=='pause')update(dt);
  draw();
  requestAnimationFrame(loop);
}
function fit(){
  const s=Math.min((innerWidth-16)/W,(innerHeight-44)/H);
  const si=s>=2?Math.floor(s):Math.max(1,s);
  cv.style.width=W*si+'px';cv.style.height=H*si+'px';
}
addEventListener('resize',fit);
buildSprites();buildDirt();loadLevel();fit();
requestAnimationFrame(loop);
</script>
